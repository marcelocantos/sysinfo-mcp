  T4.1:
    name: '`collect_power` over-releases `AppleRawMaxCapacity`'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`clang --analyze` on `main.c` with zero `osx.cocoa.RetainCount` warnings; ASan `tools/call power` on a battery Mac; a smoke assertion that `battery_health_percent` is present and in `(0, 200]` when `has_battery` is true.'
    - 'ENT-001 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-001 (P1). Status: observed fact. `IORegistryEntryCreateCFProperty` returns a +1 object. Early `CFRelease` drops that retain; a later `GetValue` and a second `CFRelease` are over-release. Default `tools/call` (no categories) includes `power`, so every full report hits this on machines with `AppleSmartBattery`. Remediation: drop the `CFRelease` at `main.c:418`; keep the single release at `main.c:433`. Optionally copy the int out once and release immediately, then compute health from locals. Blast: laptop/desktop-with-battery users of `system_info`; latent CF heap corruption rather than a deterministic crash today. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-001
    - p1
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
