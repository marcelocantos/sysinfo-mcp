# Homebrew tap publication for sysinfo-mcp. `tapper push` runs from the dev
# Mac after the GitHub release exists; the token lives in the macOS
# keychain, so there is no Actions secret and no CI step.
repo: marcelocantos/sysinfo-mcp
tap:
  owner: marcelocantos
  name: homebrew-tap
push:
  darwin_arm64: true
  linux_amd64: false
  linux_arm64: false
  skip_checksum: true
  update_readme_table: true
install: 'bin.install "sysinfo-mcp" => "sysinfo-mcp"'
test: 'system bin/"sysinfo-mcp", "--version"'
token:
  env: HOMEBREW_TAP_TOKEN
  op: op://Personal/GitHub Homebrew Tap PAT/token
