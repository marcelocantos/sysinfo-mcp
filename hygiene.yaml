# hygiene.yaml — declared, drift-validated hygiene posture for this repo.
# Schema reference: the `hygiene` skill (~/.claude/skills/hygiene/SKILL.md).
# Validate with `/hygiene`; aggregate the fleet with `/hygiene fleet`.
# Tracks steady-state ("we maintain X"), the complement to bullseye.yaml
# ("achieve X").
#
# Tiers are PER DIMENSION (schema v1): a dimension's held tier is the highest T
# such that every item in it with tier <= T is satisfied. `floors` is the
# per-dimension ratchet (below floor => DRIFT); `aspires` is the gap horizon;
# `enforce` is intent-only and does not affect tiers.

schema_version: 1

repo: sysinfo-mcp
aspires: 3
floors:            # per-dimension held-tier ratchet; below floor => DRIFT
  correctness: 1   # display smoke via make test in CI; not all categories
  security: 2      # GitHub secret scanning + push protection
  quality: 2       # -Wall -Wextra -Werror on the shipped Makefile path
  deps: 2          # cJSON vendored in-tree with upstream LICENSE
  release: 2       # MINOR-only tags; CI-built darwin-arm64; Homebrew tap
  governance: 2    # Apache-2.0 + README + .gitignore; squash-only; NOTICE
  build: 2         # Makefile all; C17
  docs: 2          # README + STABILITY.md
  perf: 0          # no benchmark suite
  vcs: 0           # no committed git hooks
  agent: 2         # agents-guide, CLAUDE.md, bullseye, --help-agent

tiers:
  1: baseline    # LICENSE + README + .gitignore; tests build & run
  2: maintained  # fmt+lint, release/governance discipline, CI matrix
  3: hardened    # security scanning, SAST, signing, fuzzing, perf

items:

  # ============================== CORRECTNESS =============================
  - id: correctness.tests
    dim: correctness
    desc: Display-category smoke test (tests/run.sh) is a Makefile target
    state: present
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {make_target: test}

  - id: correctness.ci
    dim: correctness
    desc: PR/master CI runs make bullseye (build + tests + clean tree) on macos-latest
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {ci_job: ci.yml#bullseye}

  - id: correctness.category-coverage
    dim: correctness
    desc: Smoke tests cover every system_info category, not only display
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: >-
      tests/run.sh only asserts the display contract (≥1 entry, one main,
      positive refresh, shape). cpu/memory/gpu/disk/os/network/power/thermal
      have no oracle. Entropy audit ENT-001/002 live in untested collectors.
    evidence: {absent: {file: {path: tests/run.sh, matches: '"cpu"'}}}

  - id: correctness.linux
    dim: correctness
    desc: Linux CI / port
    state: skipped
    cadence: continuous
    enforce: informational
    tier: 3
    reason: Product is macOS-only (IOKit, CoreGraphics, CoreVideo, Mach).
    evidence: {absent: {ci_job: "ci.yml#linux"}}

  - id: correctness.windows
    dim: correctness
    desc: Windows CI / port
    state: skipped
    cadence: continuous
    enforce: informational
    tier: 3
    reason: Product is macOS-only; no Windows job exists.
    evidence: {absent: {ci_job: "ci.yml#windows"}}

  - id: correctness.sanitizers
    dim: correctness
    desc: ASan/UBSan (and clang --analyze) over the C server
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: >-
      CI is make bullseye at -O2 -Werror. No sanitizer job or make target.
      Entropy audit ran clang --analyze off-CI (ENT-001 use-after-release).
    evidence: {absent: {make_target: sanitize}}

  - id: correctness.fuzzing
    dim: correctness
    desc: Fuzz harness over JSON-RPC framing / tools/call dispatch
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: Parser surface is small; no fuzz target or OSS-Fuzz integration.
    evidence: {absent: {make_target: fuzz}}

  # =========================== SECURITY / SUPPLY ==========================
  - id: security.github-secret-scan
    dim: security
    desc: GitHub secret scanning enabled on the public repo
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: security_and_analysis.secret_scanning.status, equals: enabled}}

  - id: security.secret-scan-push
    dim: security
    desc: GitHub secret-scanning push protection enabled
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence:
      gh_setting:
        key: security_and_analysis.secret_scanning_push_protection.status
        equals: enabled

  - id: security.gitleaks
    dim: security
    desc: Secret scanning (gitleaks) in pre-commit and/or CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: >-
      GitHub secret scanning + push protection are on; no gitleaks config
      or CI invocation yet.
    evidence: {absent: {scanner: {tool: gitleaks}}}

  - id: security.sast-codeql
    dim: security
    desc: CodeQL static analysis (C)
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: CodeQL supports C; not wired in CI yet.
    evidence: {absent: {ci_job: "ci.yml#codeql"}}

  - id: security.actions-perms
    dim: security
    desc: GitHub Actions default token permissions scoped to least privilege
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: ci.yml has no top-level permissions block; inherits the repo default.
    evidence: {absent: {file: {path: .github/workflows/ci.yml, matches: '(?m)^permissions:'}}}

  - id: security.signed-releases
    dim: security
    desc: Release artifacts carry provenance / are signed (cosign/sigstore)
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: release.yml uploads a tarball via gh release; no signing/attestation step.
    evidence: {absent: {ci_step: {workflow: release.yml, name: Sign}}}

  - id: security.dependabot
    dim: security
    desc: Dependabot (or equivalent) for GitHub Actions and vendored cJSON
    state: skipped
    cadence: periodic:30d
    enforce: informational
    tier: 3
    reason: >-
      Sole third-party code is vendored cJSON; Actions pins are bumped by
      hand. No package graph for Dependabot to watch.
    evidence: {absent: {file: {path: .github/dependabot.yml}}}

  # ============================== CODE QUALITY ============================
  - id: quality.c-werror
    dim: quality
    desc: Server compiles with -Wall -Wextra -Werror (CI uses these flags)
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {file: {path: Makefile, matches: '-Werror'}}

  - id: quality.clang-format
    dim: quality
    desc: C sources clang-format clean, enforced in CI
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No .clang-format; C quality is -Werror plus review.
    evidence: {absent: {file: {path: .clang-format}}}

  - id: quality.clang-tidy
    dim: quality
    desc: clang-tidy (or clang --analyze) as a CI step
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No .clang-tidy and no analyze/tidy job; analyzer was run off-CI only.
    evidence: {absent: {file: {path: .clang-tidy}}}

  # =========================== DEPENDENCY HEALTH ==========================
  - id: deps.vendor-cjson
    dim: deps
    desc: cJSON vendored in-tree with its upstream LICENSE
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: vendor/cjson/LICENSE}}

  - id: deps.freshness
    dim: deps
    desc: Vendored cJSON reviewed against latest upstream at each release
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: cJSON is pinned by copy (1.7.19 at last audit); no declared review cadence.
    evidence: {absent: {file: {path: vendor/cjson/VERSION}}}

  # ========================== RELEASE & VERSIONING =======================
  - id: release.semver-minor
    dim: release
    desc: Git tags are MINOR-only (vMAJOR.MINOR.0)
    state: enforced
    cadence: per-release
    enforce: blocking
    tier: 2
    evidence:
      command: test -z "$(git tag | grep -vE '^v[0-9]+\.[0-9]+\.0$')"

  - id: release.ci-built
    dim: release
    desc: Release binary is built by CI on macos-latest, never locally
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: release.yml#build}

  - id: release.homebrew
    dim: release
    desc: Published to the Homebrew tap on release (homebrew-releaser job)
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {ci_job: release.yml#homebrew}

  - id: release.changelog
    dim: release
    desc: A maintained CHANGELOG records user-visible changes per release
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: History lives in git + GitHub release notes; no curated CHANGELOG.md yet.
    evidence: {absent: {file: {path: CHANGELOG.md}}}

  - id: release.linux
    dim: release
    desc: Linux release artifacts / Homebrew bottles
    state: skipped
    cadence: per-release
    enforce: informational
    tier: 3
    reason: macOS-only product; release.yml sets target_linux_amd64/arm64 false.
    evidence: {absent: {ci_job: "release.yml#linux"}}

  # ============================ GOVERNANCE / META ========================
  - id: governance.license
    dim: governance
    desc: Apache-2.0 LICENSE present
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: LICENSE, matches: 'Apache License'}}

  - id: governance.readme
    dim: governance
    desc: README present and current
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md}}

  - id: governance.gitignore
    dim: governance
    desc: .gitignore covers the binary, object files, dSYM, IDE/OS clutter
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitignore}}

  - id: governance.squash-only
    dim: governance
    desc: Repo is squash-merge only, with delete-branch-on-merge
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: allow_merge_commit, equals: false}}

  - id: governance.notices
    dim: governance
    desc: NOTICE attributes vendored cJSON
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: NOTICE, matches: 'cJSON'}}

  - id: governance.security-md
    dim: governance
    desc: SECURITY.md documents the vulnerability-disclosure process
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Public repo without a published disclosure policy yet.
    evidence: {absent: {file: {path: SECURITY.md}}}

  - id: governance.codeowners
    dim: governance
    desc: CODEOWNERS file names review owners
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Solo-owned repo; no CODEOWNERS file.
    evidence: {absent: {file: {path: .github/CODEOWNERS}}}

  # ================================ BUILD ===============================
  - id: build.makefile
    dim: build
    desc: Top-level Makefile builds sysinfo-mcp from main.c + vendored cJSON
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {make_target: all}

  - id: build.c17
    dim: build
    desc: Server is C17 (Makefile -std=c17); no autotools/CMake
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: Makefile, matches: '-std=c17'}}

  # ============================ DOCUMENTATION ============================
  - id: docs.readme-surface
    dim: docs
    desc: README documents install, the system_info tool, and categories
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md, matches: 'system_info'}}

  - id: docs.stability
    dim: docs
    desc: STABILITY.md catalogues the public interaction surface
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: STABILITY.md}}

  - id: docs.md-links
    dim: docs
    desc: Internal markdown links resolve (no dead cross-references)
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: Docs exist but are not link-checked in CI.
    evidence: {absent: {make_target: check-md-links}}

  - id: docs.todo
    dim: docs
    desc: docs/TODO.md exists as the repo TODO sink
    state: skipped
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: >-
      Global convention now uses bullseye.yaml as the intent ledger;
      docs/TODO.md is banned.
    evidence: {absent: {file: {path: docs/TODO.md}}}

  # ============================== PERFORMANCE ===========================
  - id: perf.benchmarks
    dim: perf
    desc: Benchmark suite exists and builds
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: No bench target; this is a read-only sysinfo reporter, not a hot path.
    evidence: {absent: {make_target: bench}}

  # ============================== VCS / HISTORY =========================
  - id: vcs.pre-commit-hook
    dim: vcs
    desc: Committed git hooks (scripts/hooks) gate locally before commit
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No scripts/hooks; core.hooksPath is the default .git/hooks.
    evidence: {absent: {file: {path: scripts/hooks/pre-commit}}}

  # =================== AGENT-READINESS / ONBOARDING ====================
  - id: agent.agents-guide
    dim: agent
    desc: docs/agents-guide.md is the shipped agent-facing install/operate guide
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: docs/agents-guide.md}}

  - id: agent.claude-md
    dim: agent
    desc: Repo-root CLAUDE.md for coding-agent conventions
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: CLAUDE.md}}

  - id: agent.bullseye
    dim: agent
    desc: bullseye.yaml present (convergence targets discoverable)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: bullseye.yaml}}

  - id: agent.cli-help
    dim: agent
    desc: Binary exposes --version, --help, and --help-agent
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: main.c, matches: '"--help-agent"'}}

  - id: agent.repo-agents-md
    dim: agent
    desc: Repo-root AGENTS.md for multi-tool coding-agent conventions
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: >-
      Repo has CLAUDE.md (Claude adapter) and docs/agents-guide.md (product
      guide). No AGENTS.md yet; global convention prefers AGENTS.md as canonical.
    evidence: {absent: {file: {path: AGENTS.md}}}
