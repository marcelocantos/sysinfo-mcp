name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  gate:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same recipe the local pre-push hook runs (scripts/hooks/pre-push).
      - name: Gate (build + smoke tests)
        run: make gate
